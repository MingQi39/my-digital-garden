name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  DEPLOY_PATH: /var/www/my-digital-garden/dist
  INCOMING_DIR: dist-incoming
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci
          SITE_BASE_URL="$SITE_BASE_URL" npm run build
          echo "=== dist stats ==="
          du -sh dist
          echo "files: $(find dist -type f | wc -l)"
          test -f dist/index.html

      - name: Publish dist to server
        timeout-minutes: 40
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH_OPTS="-i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"
          SSH="ssh ${SSH_OPTS}"
          RSYNC_SSH="ssh ${SSH_OPTS}"

          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          echo "=== seed incoming cache from live dist if empty ==="
          $SSH "$REMOTE" bash -s <<REMOTE
          set -euo pipefail
          INCOMING="\$HOME/${INCOMING_DIR}"
          DEPLOY_PATH='$DEPLOY_PATH'
          if [ ! -f "\$INCOMING/index.html" ] && [ -f "\$DEPLOY_PATH/index.html" ]; then
            echo "seeding \$INCOMING from \$DEPLOY_PATH"
            mkdir -p "\$INCOMING"
            rsync -a "\$DEPLOY_PATH/" "\$INCOMING/"
          fi
          mkdir -p "\$INCOMING"
          REMOTE

          echo "=== rsync changed files to incoming cache ==="
          rsync -a --delete --info=stats2 \
            -e "$RSYNC_SSH" \
            dist/ "${REMOTE}:${INCOMING_DIR}/"

          echo "=== publish incoming -> deploy path ==="
          $SSH "$REMOTE" bash -s <<REMOTE
          set -euo pipefail
          INCOMING="\$HOME/${INCOMING_DIR}"
          DEPLOY_PATH='$DEPLOY_PATH'

          if [ ! -f "\$INCOMING/index.html" ]; then
            echo "ERROR: incoming dist incomplete (missing index.html)"
            exit 1
          fi

          publish() {
            mkdir -p "\$DEPLOY_PATH"
            rsync -a --delete "\$INCOMING/" "\$DEPLOY_PATH/"
          }

          if publish; then
            echo "published to \$DEPLOY_PATH"
          elif command -v sudo >/dev/null 2>&1 && sudo rsync -a --delete "\$INCOMING/" "\$DEPLOY_PATH/"; then
            echo "published via sudo rsync"
          else
            echo "ERROR: cannot write to \$DEPLOY_PATH"
            exit 1
          fi

          du -sh "\$DEPLOY_PATH"
          echo "files: \$(find "\$DEPLOY_PATH" -type f | wc -l)"
          test -f "\$DEPLOY_PATH/index.html"
          REMOTE

          echo "=== deploy complete ==="
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

  notify:
    name: Notify Feishu deploy result
    needs: deploy
    if: |
      always() &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/feishu-deploy-notify
          sparse-checkout-cone-mode: true

      - name: Notify Feishu deploy result
        uses: ./.github/actions/feishu-deploy-notify
        with:
          status: ${{ needs.deploy.result }}
          project_name: Digital Garden
          job_name: deploy
        env:
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
