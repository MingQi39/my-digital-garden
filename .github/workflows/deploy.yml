name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  DEPLOY_PATH: /var/www/my-digital-garden/dist
  BUILD_REPO: my-digital-garden
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Build and publish on server
        timeout-minutes: 55
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -tt -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "BUILD_REPO='${BUILD_REPO}' SITE_BASE_URL='${SITE_BASE_URL}' DEPLOY_PATH='${DEPLOY_PATH}' REPO_URL='${REPO_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          BUILD_REPO="${BUILD_REPO:-my-digital-garden}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/my-digital-garden/dist}"
          REPO_URL="${REPO_URL:-https://github.com/MingQi39/my-digital-garden.git}"
          BUILD_DIR="$HOME/$BUILD_REPO"
          ARCHIVE_MIRRORS=(
            "https://ghfast.top/https://github.com/MingQi39/my-digital-garden/archive/refs/heads/main.tar.gz"
            "https://mirror.ghproxy.com/https://github.com/MingQi39/my-digital-garden/archive/refs/heads/main.tar.gz"
            "https://github.com/MingQi39/my-digital-garden/archive/refs/heads/main.tar.gz"
          )

          log() { echo "[$(date -u +%H:%M:%S)] $*"; }

          ensure_node() {
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v node >/dev/null 2>&1; then
              log "node: $(node -v)"
              return 0
            fi
            log "ERROR: node not found (run scripts/deploy-bootstrap.sh on VPS once)"
            exit 1
          }

          sync_source() {
            local staging="${BUILD_DIR}.staging.$$"
            mkdir -p "$staging"
            trap 'rm -rf "$staging"' EXIT

            for url in "${ARCHIVE_MIRRORS[@]}"; do
              log "download source: $url"
              if curl -fsSL --connect-timeout 30 --retry 2 --retry-delay 5 --max-time 2400 \
                "$url" | tar -xzf - -C "$staging" --strip-components=1; then
                if [ -f "$staging/package.json" ]; then
                  if [ -d "$BUILD_DIR/node_modules" ]; then
                    log "reuse existing node_modules"
                    rm -rf "$staging/node_modules"
                    mv "$BUILD_DIR/node_modules" "$staging/node_modules"
                  fi
                  if [ -f "$BUILD_DIR/.npm-ci-hash" ]; then
                    cp "$BUILD_DIR/.npm-ci-hash" "$staging/.npm-ci-hash"
                  fi
                  rm -rf "$BUILD_DIR"
                  mv "$staging" "$BUILD_DIR"
                  trap - EXIT
                  log "source ready at $BUILD_DIR"
                  return 0
                fi
              fi
              log "download failed for $url"
              rm -rf "$staging"/*
            done

            log "ERROR: cannot download source archive (check VPS outbound network)"
            exit 1
          }

          npm_install() {
            cd "$BUILD_DIR"
            npm config set registry https://registry.npmmirror.com
            LOCK_HASH="$(md5sum package-lock.json | awk '{print $1}')"
            if [ -f .npm-ci-hash ] && [ "$(cat .npm-ci-hash)" = "$LOCK_HASH" ] && [ -d node_modules ]; then
              log "package-lock unchanged, skip npm ci"
              return 0
            fi
            log "npm ci"
            npm ci
            echo "$LOCK_HASH" > .npm-ci-hash
          }

          publish_dist() {
            cd "$BUILD_DIR"
            mkdir -p "$DEPLOY_PATH"
            if rsync -a --delete dist/ "$DEPLOY_PATH/"; then
              :
            elif command -v sudo >/dev/null 2>&1 && sudo rsync -a --delete dist/ "$DEPLOY_PATH/"; then
              log "published via sudo rsync"
            else
              log "ERROR: cannot write to $DEPLOY_PATH"
              exit 1
            fi
            log "dist published to $DEPLOY_PATH"
            du -sh "$DEPLOY_PATH"
            echo "files: $(find "$DEPLOY_PATH" -type f | wc -l)"
            test -f "$DEPLOY_PATH/index.html"
          }

          ensure_node
          sync_source
          npm_install

          log "npm run build"
          cd "$BUILD_DIR"
          SITE_BASE_URL="$SITE_BASE_URL" npm run build

          log "dist ready"
          du -sh dist
          test -f dist/index.html
          publish_dist
          log "deploy complete"
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

  notify:
    name: Notify Feishu deploy result
    needs: deploy
    if: |
      always() &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/feishu-deploy-notify
          sparse-checkout-cone-mode: true

      - name: Notify Feishu deploy result
        uses: ./.github/actions/feishu-deploy-notify
        with:
          status: ${{ needs.deploy.result }}
          project_name: Digital Garden
          job_name: deploy
        env:
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
