name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  DEPLOY_PATH: /var/www/my-digital-garden/dist

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          SITE_BASE_URL: https://notes.houmq.cn

      - name: Deploy to server
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key
          rsync -avz --delete \
            -e "ssh -i ~/.deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
