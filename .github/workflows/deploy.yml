name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  DEPLOY_PATH: /var/www/my-digital-garden/dist

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build site on GitHub
        run: npm ci && npm run build
        env:
          SITE_BASE_URL: ${{ env.SITE_BASE_URL }}

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/styles/obsidian-base.css
          compgen -G "dist/styles/_theme.*.css" > /dev/null
          du -sh dist

      - name: Publish dist to server
        timeout-minutes: 10
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH_OPTS="-i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o TCPKeepAlive=yes"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          STAGING="~/notes-dist-staging"

          echo "=== rsync dist to VPS staging ==="
          rsync -a --delete --info=stats2 \
            -e "ssh ${SSH_OPTS}" \
            dist/ "${REMOTE}:${STAGING}/"

          echo "=== publish to ${DEPLOY_PATH} ==="
          ssh ${SSH_OPTS} "$REMOTE" \
            "DEPLOY_PATH='${DEPLOY_PATH}' STAGING=\$HOME/notes-dist-staging bash -s" <<'EOF'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          if rsync -a --delete "$STAGING/" "$DEPLOY_PATH/"; then
            :
          elif command -v sudo >/dev/null 2>&1 && sudo rsync -a --delete "$STAGING/" "$DEPLOY_PATH/"; then
            :
          else
            echo "ERROR: cannot write to $DEPLOY_PATH" >&2
            exit 1
          fi
          rm -rf "$STAGING"
          test -f "$DEPLOY_PATH/index.html"
          du -sh "$DEPLOY_PATH"
          echo "deploy complete"
          EOF
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

  notify:
    name: Notify Feishu deploy result
    needs: deploy
    if: |
      always() &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/feishu-deploy-notify
          sparse-checkout-cone-mode: true

      - name: Notify Feishu deploy result
        uses: ./.github/actions/feishu-deploy-notify
        with:
          status: ${{ needs.deploy.result }}
          project_name: Digital Garden
          job_name: deploy
        env:
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
