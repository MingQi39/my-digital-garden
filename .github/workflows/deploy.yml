name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  REPO_PATH: /var/www/my-digital-garden
  DEPLOY_PATH: /var/www/my-digital-garden/dist

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          SITE_BASE_URL=https://notes.houmq.cn npm run build
          echo "=== dist stats ==="
          du -sh dist
          echo "file count: $(find dist -type f | wc -l)"

      - name: Deploy to server
        timeout-minutes: 35
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"

          # Prefer server-side build (no large cross-border transfer).
          # Fallback: atomic tarball deploy so a cancelled sync never leaves dist half-deleted.
          if $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "test -d '${REPO_PATH}/.git'"; then
            echo "=== server-side build ==="
            $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "REPO_PATH='${REPO_PATH}' SITE_BASE_URL='${SITE_BASE_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO_PATH="${REPO_PATH:-/var/www/my-digital-garden}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"
          cd "$REPO_PATH"
          git fetch origin main
          git reset --hard origin/main
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            # shellcheck disable=SC1090
            . "$HOME/.nvm/nvm.sh"
          fi
          command -v node >/dev/null
          echo "node: $(node -v)"
          npm ci
          SITE_BASE_URL="$SITE_BASE_URL" npm run build
          du -sh dist
          REMOTE
            exit 0
          fi

          echo "=== atomic tarball deploy (fallback) ==="
          STAGING="${DEPLOY_PATH}.staging.$$"
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$STAGING'"

          # Single stream, no remote rm until extract completes.
          tar -C dist -cf - . | $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "tar -xf - -C '$STAGING'"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
          set -euo pipefail
          STAGING='$STAGING'
          DEPLOY_PATH='$DEPLOY_PATH'
          if [ ! -f "\$STAGING/index.html" ]; then
            echo "ERROR: staging dist looks incomplete (missing index.html)"
            rm -rf "\$STAGING"
            exit 1
          fi
          rm -rf "\${DEPLOY_PATH}.old"
          if [ -d "\$DEPLOY_PATH" ]; then
            mv "\$DEPLOY_PATH" "\${DEPLOY_PATH}.old"
          fi
          mv "\$STAGING" "\$DEPLOY_PATH"
          rm -rf "\${DEPLOY_PATH}.old"
          echo "=== deploy complete ==="
          du -sh "\$DEPLOY_PATH"
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
