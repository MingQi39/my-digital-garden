name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  REPO_PATH: /var/www/my-digital-garden
  DEPLOY_PATH: /var/www/my-digital-garden/dist
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          SITE_BASE_URL=https://notes.houmq.cn npm run build
          echo "=== dist stats ==="
          du -sh dist
          echo "file count: $(find dist -type f | wc -l)"
          test -f dist/index.html

      - name: Deploy to server
        timeout-minutes: 40
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"

          server_build() {
            $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "REPO_PATH='${REPO_PATH}' REPO_URL='${REPO_URL}' SITE_BASE_URL='${SITE_BASE_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO_PATH="${REPO_PATH:-/var/www/my-digital-garden}"
          REPO_URL="${REPO_URL:-https://github.com/MingQi39/my-digital-garden.git}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"

          ensure_node() {
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v node >/dev/null 2>&1; then
              echo "node: $(node -v)"
              return 0
            fi

            echo "=== install nvm + node 22 (cn mirror) ==="
            export NVM_NODEJS_ORG_MIRROR="${NVM_NODEJS_ORG_MIRROR:-https://npmmirror.com/mirrors/node}"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              mkdir -p "$NVM_DIR"
              if ! git clone --depth 1 https://gitee.com/mirrors/nvm.git "$NVM_DIR" 2>/dev/null; then
                curl -fsSL --connect-timeout 60 --max-time 300 --retry 3 \
                  https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
              fi
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            nvm install 22
            nvm alias default 22
            nvm use 22
            echo "node: $(node -v)"
          }

          ensure_repo() {
            if [ -d "$REPO_PATH/.git" ]; then
              echo "=== repo exists: $REPO_PATH ==="
              return 0
            fi
            echo "=== bootstrap: clone repo ==="
            parent="$(dirname "$REPO_PATH")"
            mkdir -p "$parent"
            if [ -e "$REPO_PATH" ]; then
              backup="${REPO_PATH}.bak.$(date +%s)"
              echo "moving existing path to $backup"
              mv "$REPO_PATH" "$backup"
            fi
            for attempt in 1 2 3; do
              if git clone --depth 1 --branch main "$REPO_URL" "$REPO_PATH"; then
                return 0
              fi
              echo "git clone attempt $attempt failed, retrying..."
              sleep 5
            done
            echo "ERROR: git clone failed after 3 attempts"
            exit 1
          }

          ensure_node
          ensure_repo

          cd "$REPO_PATH"
          echo "=== git sync ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== npm ci & build ==="
          npm config set registry https://registry.npmmirror.com
          npm ci
          SITE_BASE_URL="$SITE_BASE_URL" npm run build

          echo "=== dist ready ==="
          du -sh dist
          echo "files: $(find dist -type f | wc -l)"
          test -f dist/index.html
          REMOTE
          }

          set +e
          server_build
          server_ok=$?
          set -e

          if [ "$server_ok" -eq 0 ]; then
            echo "=== server-side deploy complete ==="
            exit 0
          fi

          echo "WARNING: server-side build failed (exit $server_ok); using gzip tarball fallback"
          echo "Tip: run scripts/deploy-bootstrap.sh on the VPS once for faster future deploys."

          STAGING="${DEPLOY_PATH}.staging.$$"
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$STAGING'"

          echo "=== streaming compressed dist (~may take 10-30 min on slow links) ==="
          tar -C dist -czf - . | $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "tar -xzf - -C '$STAGING'"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
          set -euo pipefail
          STAGING='$STAGING'
          DEPLOY_PATH='$DEPLOY_PATH'
          if [ ! -f "\$STAGING/index.html" ]; then
            echo "ERROR: staging dist looks incomplete (missing index.html)"
            rm -rf "\$STAGING"
            exit 1
          fi
          rm -rf "\${DEPLOY_PATH}.old"
          if [ -d "\$DEPLOY_PATH" ]; then
            mv "\$DEPLOY_PATH" "\${DEPLOY_PATH}.old"
          fi
          mv "\$STAGING" "\$DEPLOY_PATH"
          rm -rf "\${DEPLOY_PATH}.old"
          echo "=== deploy complete ==="
          du -sh "\$DEPLOY_PATH"
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
