name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  DEPLOY_PATH: /var/www/my-digital-garden/dist
  BUILD_REPO: my-digital-garden
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to server
        timeout-minutes: 30
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH_OPTS="-i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"
          SSH="ssh ${SSH_OPTS}"
          RSYNC_SSH="ssh ${SSH_OPTS}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          BUILD_DIR="\$HOME/${BUILD_REPO}"

          HAS_SOURCE="$($SSH "$REMOTE" "[ -f ${BUILD_DIR}/package.json ] && echo yes || echo no")"
          if [ "$HAS_SOURCE" != "yes" ]; then
            echo "no local source yet, VPS step will bootstrap from mirror"
            exit 0
          fi

          echo "=== incremental rsync source ==="
          rsync -a --delete --info=stats2 \
            --exclude node_modules \
            --exclude dist \
            --exclude .git \
            -e "$RSYNC_SSH" \
            ./ "${REMOTE}:${BUILD_REPO}/"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Build on server
        timeout-minutes: 45
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"

          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          BUILD_DIR="\$HOME/${BUILD_REPO}"

          $SSH "$REMOTE" \
            "BUILD_REPO='${BUILD_REPO}' SITE_BASE_URL='${SITE_BASE_URL}' DEPLOY_PATH='${DEPLOY_PATH}' bash ${BUILD_DIR}/scripts/deploy-on-server.sh build"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Publish on server
        timeout-minutes: 10
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"

          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          BUILD_DIR="\$HOME/${BUILD_REPO}"

          $SSH "$REMOTE" \
            "BUILD_REPO='${BUILD_REPO}' DEPLOY_PATH='${DEPLOY_PATH}' bash ${BUILD_DIR}/scripts/deploy-on-server.sh publish"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

  notify:
    name: Notify Feishu deploy result
    needs: deploy
    if: |
      always() &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/feishu-deploy-notify
          sparse-checkout-cone-mode: true

      - name: Notify Feishu deploy result
        uses: ./.github/actions/feishu-deploy-notify
        with:
          status: ${{ needs.deploy.result }}
          project_name: Digital Garden
          job_name: deploy
        env:
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
