name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  REPO_PATH: /var/www/my-digital-garden
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Build on server
        timeout-minutes: 40
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REPO_PATH='${REPO_PATH}' REPO_URL='${REPO_URL}' SITE_BASE_URL='${SITE_BASE_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO_PATH="${REPO_PATH:-/var/www/my-digital-garden}"
          REPO_URL="${REPO_URL:-https://github.com/MingQi39/my-digital-garden.git}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"

          ensure_node() {
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v node >/dev/null 2>&1; then
              echo "node: $(node -v)"
              return 0
            fi
            echo "=== install nvm + node 22 ==="
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            nvm install 22
            nvm alias default 22
            nvm use 22
            echo "node: $(node -v)"
          }

          ensure_repo() {
            if [ -d "$REPO_PATH/.git" ]; then
              echo "=== repo exists: $REPO_PATH ==="
              return 0
            fi
            echo "=== bootstrap: clone repo ==="
            parent="$(dirname "$REPO_PATH")"
            mkdir -p "$parent"
            if [ -e "$REPO_PATH" ]; then
              backup="${REPO_PATH}.bak.$(date +%s)"
              echo "moving existing path to $backup"
              mv "$REPO_PATH" "$backup"
            fi
            git clone --depth 1 --branch main "$REPO_URL" "$REPO_PATH"
          }

          ensure_node
          ensure_repo

          cd "$REPO_PATH"
          echo "=== git sync ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== npm ci & build ==="
          npm ci
          SITE_BASE_URL="$SITE_BASE_URL" npm run build

          echo "=== dist ready ==="
          du -sh dist
          echo "files: $(find dist -type f | wc -l)"
          test -f dist/index.html
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
