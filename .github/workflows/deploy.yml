name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  REPO_PATH: /var/www/my-digital-garden

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Build on server
        timeout-minutes: 25
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REPO_PATH='${REPO_PATH}' SITE_BASE_URL='${SITE_BASE_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO_PATH="${REPO_PATH:-/var/www/my-digital-garden}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"

          if [ ! -d "$REPO_PATH/.git" ]; then
            echo "ERROR: $REPO_PATH is not a git repo."
            echo "One-time on server: bash scripts/deploy-bootstrap.sh"
            exit 1
          fi

          cd "$REPO_PATH"
          echo "=== git sync ==="
          git fetch origin main
          git reset --hard origin/main

          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            # shellcheck disable=SC1090
            . "$HOME/.nvm/nvm.sh"
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "ERROR: node not found on server (need Node 22)."
            exit 1
          fi
          echo "node: $(node -v)"

          echo "=== npm ci & build ==="
          npm ci
          SITE_BASE_URL="$SITE_BASE_URL" npm run build

          echo "=== dist ready ==="
          du -sh dist
          echo "files: $(find dist -type f | wc -l)"
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
