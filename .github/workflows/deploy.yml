name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  REPO_PATH: /var/www/my-digital-garden
  DEPLOY_PATH: /var/www/my-digital-garden/dist
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          SITE_BASE_URL=https://notes.houmq.cn npm run build
          echo "=== dist stats ==="
          du -sh dist
          echo "file count: $(find dist -type f | wc -l)"
          test -f dist/index.html

      - name: Deploy to server
        timeout-minutes: 35
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"

          if $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "test -d '${REPO_PATH}/.git' && command -v node >/dev/null 2>&1"; then
            echo "=== server-side build ==="
            $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "REPO_PATH='${REPO_PATH}' SITE_BASE_URL='${SITE_BASE_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO_PATH="${REPO_PATH:-/var/www/my-digital-garden}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"
          export PATH="$HOME/.local/bin:$PATH"
          cd "$REPO_PATH"
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            # shellcheck disable=SC1090
            . "$HOME/.nvm/nvm.sh"
          fi
          echo "node: $(node -v)"
          git fetch origin main
          git reset --hard origin/main
          npm ci
          SITE_BASE_URL="$SITE_BASE_URL" npm run build
          du -sh dist
          test -f dist/index.html
          REMOTE
            exit 0
          fi

          echo "=== compressed tarball deploy (fallback) ==="
          STAGING="${DEPLOY_PATH}.staging.$$"
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$STAGING'"

          tar -C dist -czf - . | $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "tar -xzf - -C '$STAGING'"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
          set -euo pipefail
          STAGING='$STAGING'
          DEPLOY_PATH='$DEPLOY_PATH'
          if [ ! -f "\$STAGING/index.html" ]; then
            echo "ERROR: staging dist looks incomplete (missing index.html)"
            rm -rf "\$STAGING"
            exit 1
          fi
          rm -rf "\${DEPLOY_PATH}.old"
          if [ -d "\$DEPLOY_PATH" ]; then
            mv "\$DEPLOY_PATH" "\${DEPLOY_PATH}.old"
          fi
          mv "\$STAGING" "\$DEPLOY_PATH"
          rm -rf "\${DEPLOY_PATH}.old"
          echo "=== deploy complete ==="
          du -sh "\$DEPLOY_PATH"
          REMOTE

          echo "=== best-effort server bootstrap (repo + node) ==="
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REPO_PATH='${REPO_PATH}' REPO_URL='${REPO_URL}' bash -s" <<'REMOTE' || true
          set -euo pipefail
          REPO_PATH="${REPO_PATH:-/var/www/my-digital-garden}"
          REPO_URL="${REPO_URL:-https://github.com/MingQi39/my-digital-garden.git}"
          export PATH="$HOME/.local/bin:$PATH"

          if [ -d "$REPO_PATH/.git" ]; then
            echo "repo already present"
          else
            parent="$(dirname "$REPO_PATH")"
            mkdir -p "$parent"
            scratch="$(mktemp -d "${parent}/.repo-bootstrap.XXXXXX")"
            git clone --depth 1 --branch main "$REPO_URL" "$scratch"
            if [ ! -e "$REPO_PATH" ]; then
              mv "$scratch" "$REPO_PATH"
            else
              shopt -s dotglob
              for item in "$scratch"/*; do
                base="$(basename "$item")"
                if [ "$base" = "dist" ] && [ -d "$REPO_PATH/dist" ]; then
                  continue
                fi
                rm -rf "$REPO_PATH/$base"
                mv "$item" "$REPO_PATH/$base"
              done
              shopt -u dotglob
              rm -rf "$scratch"
            fi
            echo "repo bootstrapped at $REPO_PATH"
          fi

          if command -v node >/dev/null 2>&1; then
            echo "node: $(node -v)"
            exit 0
          fi

          NODE_VERSION="${NODE_VERSION:-22.17.1}"
          ARCH="${NODE_ARCH:-linux-x64}"
          PREFIX="${NODE_PREFIX:-$HOME/.local}"
          TARBALL="node-v${NODE_VERSION}-${ARCH}.tar.xz"
          tmpdir="$(mktemp -d)"
          for url in \
            "https://npmmirror.com/mirrors/node/v${NODE_VERSION}/${TARBALL}" \
            "https://nodejs.org/dist/v${NODE_VERSION}/${TARBALL}"; do
            echo "trying $url"
            if curl -fsSL --connect-timeout 30 --max-time 900 "$url" -o "$tmpdir/$TARBALL"; then
              mkdir -p "$PREFIX"
              tar -xJf "$tmpdir/$TARBALL" -C "$PREFIX" --strip-components=1
              export PATH="$PREFIX/bin:$PATH"
              grep -qs '\.local/bin' "$HOME/.bashrc" 2>/dev/null || \
                echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"
              echo "node: $(node -v)"
              rm -rf "$tmpdir"
              exit 0
            fi
          done
          rm -rf "$tmpdir"
          echo "WARN: node install skipped (mirrors unreachable)"
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Verify live site
        run: |
          set -euo pipefail
          curl -fsSI "$SITE_BASE_URL/" | grep -E '^HTTP/.* 200'
          curl -fsSI "$SITE_BASE_URL/notes/002.AI/009.赋范%20AI/005.大模型%20RAG%20入门/001.大模型%20RAG%20入门基础架构介绍/" | grep -E '^HTTP/.* 200'
