name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  DEPLOY_PATH: /var/www/my-digital-garden/dist
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Deploy on server
        timeout-minutes: 55
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -tt -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GH_TOKEN='${GH_TOKEN}' REPO_URL='${REPO_URL}' SITE_BASE_URL='${SITE_BASE_URL}' DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO_URL="${REPO_URL:-https://github.com/MingQi39/my-digital-garden.git}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"
          BUILD_REPO="${BUILD_REPO:-$HOME/my-digital-garden}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/my-digital-garden/dist}"
          AUTH_REPO="https://x-access-token:${GH_TOKEN}@github.com/MingQi39/my-digital-garden.git"

          log() { echo "[$(date -u +%H:%M:%S)] $*"; }

          ensure_node() {
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v node >/dev/null 2>&1; then
              log "node: $(node -v)"
              return 0
            fi

            log "install nvm + node 22 (cn mirror)"
            export NVM_NODEJS_ORG_MIRROR="${NVM_NODEJS_ORG_MIRROR:-https://npmmirror.com/mirrors/node}"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              mkdir -p "$NVM_DIR"
              if ! timeout 120 git clone --depth 1 https://gitee.com/mirrors/nvm.git "$NVM_DIR" 2>/dev/null; then
                curl -fsSL --connect-timeout 60 --max-time 300 --retry 3 \
                  https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
              fi
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            nvm install 22
            nvm alias default 22
            nvm use 22
            log "node: $(node -v)"
          }

          pick_build_repo() {
            for candidate in "$BUILD_REPO" /var/www/my-digital-garden "$HOME/my-digital-garden"; do
              if [ -d "$candidate/.git" ] && git -C "$candidate" rev-parse HEAD >/dev/null 2>&1; then
                BUILD_REPO="$candidate"
                log "using existing repo: $BUILD_REPO"
                return 0
              fi
            done
            return 1
          }

          ensure_repo() {
            if pick_build_repo; then
              return 0
            fi

            log "bootstrap: clone repo to $BUILD_REPO"
            mkdir -p "$(dirname "$BUILD_REPO")"
            rm -rf "$BUILD_REPO"

            if [ -n "${GH_TOKEN:-}" ]; then
              log "try clone via GITHUB_TOKEN"
              if timeout 600 git clone --depth 1 --branch main "$AUTH_REPO" "$BUILD_REPO"; then
                git -C "$BUILD_REPO" remote set-url origin "$REPO_URL"
                return 0
              fi
              log "token clone failed"
              rm -rf "$BUILD_REPO"
            fi

            log "ERROR: cannot clone repo (set GH_TOKEN or run scripts/deploy-bootstrap.sh on VPS once)"
            exit 1
          }

          git_sync() {
            cd "$BUILD_REPO"
            log "git sync"
            export GIT_TERMINAL_PROMPT=0
            if [ -n "${GH_TOKEN:-}" ]; then
              git remote set-url origin "$AUTH_REPO"
            fi
            timeout 300 git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
            if [ -n "${GH_TOKEN:-}" ]; then
              git remote set-url origin "$REPO_URL"
            fi
            log "synced to $(git rev-parse --short HEAD)"
          }

          npm_install() {
            npm config set registry https://registry.npmmirror.com
            LOCK_HASH="$(md5sum package-lock.json | awk '{print $1}')"
            if [ -f .npm-ci-hash ] && [ "$(cat .npm-ci-hash)" = "$LOCK_HASH" ] && [ -d node_modules ]; then
              log "package-lock unchanged, skip npm ci"
              return 0
            fi
            log "npm ci"
            npm ci
            echo "$LOCK_HASH" > .npm-ci-hash
          }

          publish_dist() {
            mkdir -p "$DEPLOY_PATH"
            if rsync -a --delete dist/ "$DEPLOY_PATH/"; then
              :
            elif command -v sudo >/dev/null 2>&1 && sudo rsync -a --delete dist/ "$DEPLOY_PATH/"; then
              log "published via sudo rsync"
            else
              log "ERROR: cannot write to $DEPLOY_PATH"
              exit 1
            fi
            log "dist published to $DEPLOY_PATH"
            du -sh "$DEPLOY_PATH"
            echo "files: $(find "$DEPLOY_PATH" -type f | wc -l)"
            test -f "$DEPLOY_PATH/index.html"
          }

          ensure_node
          ensure_repo
          git_sync
          npm_install

          log "npm run build"
          SITE_BASE_URL="$SITE_BASE_URL" npm run build

          log "dist ready"
          du -sh dist
          echo "files: $(find dist -type f | wc -l)"
          test -f dist/index.html
          publish_dist
          log "server-side deploy complete"
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Feishu deploy result
    needs: deploy
    if: |
      always() &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/feishu-deploy-notify
          sparse-checkout-cone-mode: true

      - name: Notify Feishu deploy result
        uses: ./.github/actions/feishu-deploy-notify
        with:
          status: ${{ needs.deploy.result }}
          project_name: Digital Garden
          job_name: deploy
        env:
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
