name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: notes-deploy
  cancel-in-progress: true

env:
  SITE_BASE_URL: https://notes.houmq.cn
  DEPLOY_PATH: /var/www/my-digital-garden/dist
  BUILD_REPO: my-digital-garden
  REPO_URL: https://github.com/MingQi39/my-digital-garden.git

jobs:
  deploy:
    name: Build and deploy notes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to server
        timeout-minutes: 85
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH_OPTS="-i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"
          SSH="ssh ${SSH_OPTS}"
          RSYNC_SSH="ssh ${SSH_OPTS}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          REMOTE_BUILD_DIR="$($SSH "$REMOTE" "BUILD_REPO='${BUILD_REPO}' bash -s" <<'REMOTE'
          for d in "$HOME/$BUILD_REPO" /var/www/my-digital-garden; do
            if [ -f "$d/package.json" ]; then
              echo "$d"
              exit 0
            fi
          done
          echo "$HOME/$BUILD_REPO"
          REMOTE
          )"
          echo "remote build dir: $REMOTE_BUILD_DIR"

          echo "=== rsync source to server (incremental) ==="
          rsync -a --delete --info=stats2 \
            --exclude node_modules \
            --exclude dist \
            --exclude .git \
            -e "$RSYNC_SSH" \
            ./ "${REMOTE}:${REMOTE_BUILD_DIR}/"

      - name: Build and publish on server
        timeout-minutes: 45
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.deploy_key

          SSH="ssh -tt -i ~/.deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8"

          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "BUILD_REPO='${BUILD_REPO}' SITE_BASE_URL='${SITE_BASE_URL}' DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          BUILD_REPO="${BUILD_REPO:-my-digital-garden}"
          SITE_BASE_URL="${SITE_BASE_URL:-https://notes.houmq.cn}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/my-digital-garden/dist}"

          BUILD_DIR=""
          for candidate in "$HOME/$BUILD_REPO" /var/www/my-digital-garden; do
            if [ -f "$candidate/package.json" ]; then
              BUILD_DIR="$candidate"
              break
            fi
          done
          BUILD_DIR="${BUILD_DIR:-$HOME/$BUILD_REPO}"

          log() { echo "[$(date -u +%H:%M:%S)] $*"; }

          ensure_node() {
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1090
              . "$NVM_DIR/nvm.sh"
            fi
            if command -v node >/dev/null 2>&1; then
              log "node: $(node -v)"
              return 0
            fi
            log "ERROR: node not found (run scripts/deploy-bootstrap.sh on VPS once)"
            exit 1
          }

          npm_install() {
            cd "$BUILD_DIR"
            npm config set registry https://registry.npmmirror.com
            LOCK_HASH="$(md5sum package-lock.json | awk '{print $1}')"
            if [ -f .npm-ci-hash ] && [ "$(cat .npm-ci-hash)" = "$LOCK_HASH" ] && [ -d node_modules ]; then
              log "package-lock unchanged, skip npm ci"
              return 0
            fi
            log "npm ci"
            npm ci
            echo "$LOCK_HASH" > .npm-ci-hash
          }

          publish_dist() {
            cd "$BUILD_DIR"
            mkdir -p "$DEPLOY_PATH"
            if rsync -a --delete dist/ "$DEPLOY_PATH/"; then
              :
            elif command -v sudo >/dev/null 2>&1 && sudo rsync -a --delete dist/ "$DEPLOY_PATH/"; then
              log "published via sudo rsync"
            else
              log "ERROR: cannot write to $DEPLOY_PATH"
              exit 1
            fi
            log "dist published to $DEPLOY_PATH"
            du -sh "$DEPLOY_PATH"
            echo "files: $(find "$DEPLOY_PATH" -type f | wc -l)"
            test -f "$DEPLOY_PATH/index.html"
          }

          if [ ! -f "$BUILD_DIR/package.json" ]; then
            log "ERROR: source sync missing at $BUILD_DIR"
            exit 1
          fi

          ensure_node
          npm_install

          log "npm run build"
          cd "$BUILD_DIR"
          SITE_BASE_URL="$SITE_BASE_URL" npm run build

          log "dist ready"
          du -sh dist
          test -f dist/index.html
          publish_dist
          log "deploy complete"
          REMOTE
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

  notify:
    name: Notify Feishu deploy result
    needs: deploy
    if: |
      always() &&
      needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/feishu-deploy-notify
          sparse-checkout-cone-mode: true

      - name: Notify Feishu deploy result
        uses: ./.github/actions/feishu-deploy-notify
        with:
          status: ${{ needs.deploy.result }}
          project_name: Digital Garden
          job_name: deploy
        env:
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
